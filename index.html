<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Happy Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">I'M HAPPY</div>
        <nav>
            <ul class="nav-links">
                <li><a href="#">ראשי</a></li>
                <li><a href="#">אודות</a></li>
                <li><a href="#">שירותים</a></li>
                <li><a href="#">צור קשר</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1 class="fade-in">ברוכים הבאים לאיים האפי</h1>
        <p class="fade-in delay-1">מקום לשיפור החיים והשגת מטרות</p>
        <button class="primary-button fade-in delay-2">למד עוד</button>
    </section>

    <section class="services">
        <h2>השירותים שלנו</h2>
        <div class="services-grid">
            <div class="service-card slide-up">
                <h3>ייעוץ אישי</h3>
                <p>עזרה פרטית להגשמת מטרותיך.</p>
            </div>
            <div class="service-card slide-up delay-1">
                <h3>סדנאות קבוצתיות</h3>
                <p>לימוד והתפתחות אישית עם אחרים.</p>
            </div>
            <div class="service-card slide-up delay-2">
                <h3>משאבים אונליין</h3>
                <p>גישה לקורסים וחומרים דיגיטליים.</p>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2025 I'M HAPPY. כל הזכויות שמורות.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
